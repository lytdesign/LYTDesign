<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-label="LYTDesign foundation: Human Centered, Simplicity and Elegance, Inclusive by Design, Thoughtful Interfaces, Privacy is Sacred, Purpose Driven." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#200D39"/><stop offset="1" stop-color="#160530"/></linearGradient>
  <linearGradient id="cardf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26123E"/><stop offset="1" stop-color="#1D0939"/></linearGradient>
</defs>
<rect width="1200" height="496" rx="22" fill="url(#bgf)"/>
<rect x="24" y="24" width="368" height="212" rx="16" fill="url(#cardf)" stroke="#FFFFFF" stroke-opacity="0.09"/><circle cx="74" cy="76" r="25" fill="#FCD53F" fill-opacity="0.125" stroke="#FCD53F" stroke-opacity="0.35" stroke-width="1"/>
<g transform="translate(62 64)" fill="none" stroke="#FCD53F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></g><text x="50" y="138" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Human Centered</text><text x="50" y="164" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">Every product begins with real human</text><text x="50" y="187" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">usability not corporate pressure.</text><rect x="416" y="24" width="368" height="212" rx="16" fill="url(#cardf)" stroke="#FFFFFF" stroke-opacity="0.09"/><circle cx="466" cy="76" r="25" fill="#FCD53F" fill-opacity="0.125" stroke="#FCD53F" stroke-opacity="0.35" stroke-width="1"/>
<g transform="translate(454 64)" fill="none" stroke="#FCD53F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8L21.5 18.5l-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></g><text x="442" y="138" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Simplicity &amp; Elegance</text><text x="442" y="164" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">No clutter. No noise. Only focus.</text><text x="442" y="187" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">Design that creates calm clarity and</text><text x="442" y="210" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">tranquility.</text><rect x="808" y="24" width="368" height="212" rx="16" fill="url(#cardf)" stroke="#FFFFFF" stroke-opacity="0.09"/><circle cx="858" cy="76" r="25" fill="#FCD53F" fill-opacity="0.125" stroke="#FCD53F" stroke-opacity="0.35" stroke-width="1"/>
<g transform="translate(846 64)" fill="none" stroke="#FCD53F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M5 8.5h14M12 8.5v5.5m0 0l-3.2 6.5M12 14l3.2 6.5"/></g><text x="834" y="138" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Inclusive by Design</text><text x="834" y="164" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">Designed with usability clarity and</text><text x="834" y="187" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">accessibility principles built naturally</text><text x="834" y="210" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">into the experience.</text><rect x="24" y="260" width="368" height="212" rx="16" fill="url(#cardf)" stroke="#FFFFFF" stroke-opacity="0.09"/><circle cx="74" cy="312" r="25" fill="#FCD53F" fill-opacity="0.125" stroke="#FCD53F" stroke-opacity="0.35" stroke-width="1"/>
<g transform="translate(62 300)" fill="none" stroke="#FCD53F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></g><text x="50" y="374" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Thoughtful Interfaces</text><text x="50" y="400" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">Interfaces designed to feel intuitive</text><text x="50" y="423" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">structured and comfortable for</text><text x="50" y="446" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">everyday use.</text><rect x="416" y="260" width="368" height="212" rx="16" fill="url(#cardf)" stroke="#FFFFFF" stroke-opacity="0.09"/><circle cx="466" cy="312" r="25" fill="#FCD53F" fill-opacity="0.125" stroke="#FCD53F" stroke-opacity="0.35" stroke-width="1"/>
<g transform="translate(454 300)" fill="none" stroke="#FCD53F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/><circle cx="12" cy="15.2" r="1.2"/></g><text x="442" y="374" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Privacy is Sacred</text><text x="442" y="400" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">No ads. No tracking. No data resale.</text><text x="442" y="423" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">Revenue comes from features. Never</text><text x="442" y="446" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">from user data.</text><rect x="808" y="260" width="368" height="212" rx="16" fill="url(#cardf)" stroke="#FFFFFF" stroke-opacity="0.09"/><circle cx="858" cy="312" r="25" fill="#FCD53F" fill-opacity="0.125" stroke="#FCD53F" stroke-opacity="0.35" stroke-width="1"/>
<g transform="translate(846 300)" fill="none" stroke="#FCD53F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1L3.1 9.5l6.1-.9z"/></g><text x="834" y="374" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Purpose Driven</text><text x="834" y="400" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">Every product is created with intention</text><text x="834" y="423" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">care and long term value before</text><text x="834" y="446" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#968DA3">trends or hype.</text></svg>